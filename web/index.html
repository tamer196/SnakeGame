<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover puts the page under the notch and home indicator so we
      can paint to the physical edges; the layout then insets itself using the
      env(safe-area-inset-*) values below.
      user-scalable=no / maximum-scale=1 stop a double-tap or pinch from zooming
      the canvas mid-game.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="NEON SERPENT - a touch-driven arcade snake game" />

    <!-- iOS standalone web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>NEON SERPENT</title>

    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070f;
        color: #eef4ff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        /* Kill the mobile browser gestures that would otherwise fight the game:
           pull-to-refresh, double-tap zoom, text selection on long press, and
           the grey tap highlight. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        position: fixed;
        inset: 0;
        display: block;
      }

      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Shown while the bundle boots, replaced on first frame. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #05070f;
        z-index: 10;
        transition: opacity 0.4s ease;
      }

      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }

      #boot h1 {
        font-size: clamp(28px, 7vw, 64px);
        letter-spacing: 0.14em;
        font-weight: 800;
        color: #00ecff;
        text-shadow: 0 0 24px rgba(0, 236, 255, 0.55);
      }

      #boot p {
        font-size: 14px;
        letter-spacing: 0.22em;
        color: #6b7a99;
      }

      /* Landscape lock: phones play in landscape, so portrait gets a prompt
         rather than a broken layout. Tablets are wide enough either way, so the
         prompt only targets short viewports. */
      #rotate {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #05070f;
        z-index: 20;
        text-align: center;
        padding: 24px;
      }

      #rotate svg {
        width: 78px;
        height: 78px;
        stroke: #00ecff;
        fill: none;
        stroke-width: 6;
        animation: tilt 2.2s ease-in-out infinite;
      }

      @keyframes tilt {
        0%, 40% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }

      #rotate h2 {
        font-size: 20px;
        letter-spacing: 0.12em;
        color: #eef4ff;
      }

      #rotate p {
        font-size: 14px;
        color: #6b7a99;
        max-width: 30ch;
        line-height: 1.5;
      }

      @media (orientation: portrait) and (max-height: 950px) {
        body.landscape-lock #rotate {
          display: flex;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #rotate svg { animation: none; }
      }
    </style>
  </head>
  <body class="landscape-lock">
    <div id="app"></div>

    <div id="boot">
      <h1>NEON SERPENT</h1>
      <p>LOADING</p>
    </div>

    <div id="rotate">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect x="30" y="10" width="40" height="80" rx="6" />
        <line x1="42" y1="80" x2="58" y2="80" />
      </svg>
      <h2>ROTATE YOUR DEVICE</h2>
      <p>NEON SERPENT is played in landscape.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
